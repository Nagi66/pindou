<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>拼豆画板</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{display:flex;flex-direction:column}
.wrap-all{display:flex;flex:1}
.size-bar{padding:10px;border-bottom:1px solid #ddd}
.size-btn{padding:5px 8px;margin:0 3px;border:1px solid #999;background:#fff;cursor:pointer}
.size-btn.active{background:#333;color:#fff;border-color:#333}
.canvas-box{flex:1;padding:10px;overflow:auto;background:#f7f7f7}
#grid{display:grid;gap:3px;width:fit-content}
.cell{
    width:20px;height:20px;cursor:pointer;border-radius:50%;
    background:#f7f7f7 radial-gradient(#ccc 22.4%, transparent 22.5%);
}
.color-box{width:140px;padding:10px;border-left:1px solid #ddd}
.color-item{width:24px;height:24px;border-radius:50%;margin:4px;display:inline-block;cursor:pointer;border:2px solid transparent}
.color-item.active{border-color:#000}
@media(max-width:768px){
    body{height:auto;overflow:auto}
    .wrap-all{flex-direction:column;height:auto}
}
</style>
</head>
<body>
<div class="size-bar">
    <button class="size-btn active" data-w="16" data-h="16">16×16</button>
    <button class="size-btn" data-w="24" data-h="24">24×24</button>
    <button class="size-btn" data-w="32" data-h="32">32×32</button>
</div>
<div class="wrap-all">
    <div class="canvas-box">
        <div id="grid"></div>
    </div>
    <div class="color-box" id="colorWrap"></div>
</div>

<script>
// 配色
const colorList = ['#000000','#ffffff','#e53935','#43a047','#1e88e5','#fdd835','#8e24aa','#ff7f50'];
let nowColor = colorList[2];
let map = [];
const gridDom = document.getElementById('grid');
const colorWrap = document.getElementById('colorWrap');

// 圆环样式
function setRing(el,color){
    el.style.background=`radial-gradient(transparent 30%, ${color} 31%)`;
}

// 生成色卡
function renderColor(){
    colorWrap.innerHTML = '';
    colorList.forEach(c=>{
        let d = document.createElement('span');
        d.className = 'color-item';
        if(c===nowColor) d.classList.add('active');
        d.style.backgroundColor = c;
        d.onclick=()=>{
            nowColor = c;
            document.querySelectorAll('.color-item').forEach(i=>i.classList.remove('active'));
            d.classList.add('active');
        }
        colorWrap.appendChild(d);
    })
}

// 生成画布
function createGrid(w,h){
    gridDom.innerHTML='';
    map=[];
    gridDom.style.gridTemplateColumns = `repeat(${w},20px)`;
    for(let y=0;y<h;y++){
        map[y]=[];
        for(let x=0;x<w;x++){
            map[y][x]=null;
            let cell = document.createElement('div');
            cell.className='cell';
            cell.dataset.x=x;
            cell.dataset.y=y;

            // ====== 核心：点击有豆摘除、空白上色 ======
            cell.onclick = function(){
                let x = +this.dataset.x;
                let y = +this.dataset.y;
                if(map[y][x]){
                    // 已有颜色 → 摘除还原空白
                    map[y][x]=null;
                    this.style.background="#f7f7f7 radial-gradient(#ccc 22.4%, transparent 22.5%)";
                }else{
                    // 空位置 → 上色
                    map[y][x]=nowColor;
                    setRing(this,nowColor);
                }
            }
            gridDom.appendChild(cell);
        }
    }
}

// 尺寸切换
document.querySelectorAll('.size-btn').forEach(btn=>{
    btn.onclick=()=>{
        document.querySelectorAll('.size-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        createGrid(+btn.dataset.w,+btn.dataset.h);
    }
})

// 初始化
renderColor();
createGrid(16,16);
</script>
</body>
</html>
