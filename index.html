<!DOCTYPE html>

    <meta charset="UTF-8">

    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
        body{display:flex;height:100vh;overflow:hidden}
        /* 左侧竖向分类Tab */
        .tab-left{
            width:70px;background:#f2f2f2;display:flex;flex-direction:column;
        }
        .tab-item{
            padding:16px 6px;text-align:center;cursor:pointer;border-bottom:1px solid #ddd;
            font-size:14px;
        }
        .tab-item.active{background:#333;color:#fff}
        /* 右侧主区域 */
        .main-box{flex:1;display:flex;flex-direction:column}
        /* 顶部尺寸选择 */
        .size-bar{padding:12px;border-bottom:1px solid #ddd}
        .size-btn{padding:6px 12px;margin:0 4px;cursor:pointer;border:1px solid #999;background:#fff}
        .size-btn.active{background:#333;color:#fff;border-color:#333}
        /* 颜色选择区 */
        .color-wrap{padding:12px;border-bottom:1px solid #eee;min-height:130px}
        .color-list{display:flex;gap:8px;flex-wrap:wrap}
        .color-item{
            width:52px;height:62px;display:flex;flex-direction:column;align-items:center;cursor:pointer;
        }
        .color-name{font-size:11px;margin-bottom:4px;white-space:nowrap}
        .color-block{width:42px;height:42px;border:1px solid #aaa}
        /* 画布区域 */
        .canvas-box{flex:1;padding:10px;overflow:auto}
        #grid{display:grid;gap:1px;background:#ccc;width:fit-content}
        .cell{background:#fff;cursor:pointer}
    </style>
</head>

<!-- 左侧竖向分类Tab（含H系） -->
<div class="tab-left" id="tabWrap">
    <div class="tab-item active" data-type="A">A灰白</div>
    <div class="tab-item" data-type="B">B棕肤</div>
    <div class="tab-item" data-type="C">C红色</div>
    <div class="tab-item" data-type="D">D橙黄</div>
    <div class="tab-item" data-type="E">E绿色</div>
    <div class="tab-item" data-type="F">F蓝色</div>
    <div class="tab-item" data-type="G">G紫玫</div>
    <div class="tab-item" data-type="H">H灰补</div>
</div>

<div class="main-box">
    <!-- 尺寸选择 -->
    <div class="size-bar">
        <span>画布尺寸：</span>
        <button class="size-btn active" data-num="15">15×15(耳钉)</button>
        <button class="size-btn" data-num="20">20×20(小挂饰)</button>
        <button class="size-btn" data-num="25">25×25(主流)</button>
        <button class="size-btn" data-num="30">30×30(大号)</button>
        <button class="size-btn" data-num="40">40×40(超大)</button>
        <button class="size-btn" data-num="50">50×50(巨型)</button>
    </div>
    <!-- 颜色面板 -->
    <div class="color-wrap">
        <div class="color-list" id="colorBox"></div>
    </div>
    <!-- 拼豆画布 -->
    <div class="canvas-box">
        <div id="grid"></div>
    </div>
</div>

let currentType = "A";
let currentColor = "#FFFFFF";

// 渲染颜色列表
function renderColors(type){
    const box = document.getElementById("colorBox");
    box.innerHTML = "";
    colorData[type].forEach(([name, hex]) => {
        const item = document.createElement("div");
        item.className = "color-item";
        item.innerHTML = `
            <div class="color-name">${name}</div>
            <div class="color-block" style="background:${hex}"></div>
        `;
        item.addEventListener("click", () => {
            currentColor = hex;
            document.querySelectorAll(".color-block").forEach(b => b.style.outline = "none");
            item.querySelector(".color-block").style.outline = "2px solid #333";
        });
        box.appendChild(item);
    });
}

// Tab 切换
document.getElementById("tabWrap").addEventListener("click", (e) => {
    if(e.target.classList.contains("tab-item")){
        document.querySelectorAll(".tab-item").forEach(t => t.classList.remove("active"));
        e.target.classList.add("active");
        currentType = e.target.dataset.type;
        renderColors(currentType);
    }
});

// 生成画布
function createGrid(size){
    const grid = document.getElementById("grid");
    grid.innerHTML = "";
    grid.style.gridTemplateColumns = `repeat(${size}, 20px)`;
    for(let i=0; i<size*size; i++){
        const cell = document.createElement("div");
        cell.className = "cell";
        cell.style.width = "20px";
        cell.style.height = "20px";
        cell.addEventListener("click", () => cell.style.background = currentColor);
        grid.appendChild(cell);
    }
}

// 尺寸按钮
document.querySelector(".size-bar").addEventListener("click", (e) => {
    if(e.target.classList.contains("size-btn")){
        document.querySelectorAll(".size-btn").forEach(b => b.classList.remove("active"));
        e.target.classList.add("active");
        createGrid(parseInt(e.target.dataset.num));
    }
});

// 初始化
renderColors(currentType);
createGrid(15);
